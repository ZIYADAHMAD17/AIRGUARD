services:
  - type: web
    name: airguard-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -m backend.analysis && python -m backend.train_models"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        value: "*"
